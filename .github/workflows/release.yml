name: Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - dev
    paths-ignore:
      - "README.md"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  KEEP_RELEASES: 10

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: 'go.sum'

      - name: Test
        run: go test ./...

      - name: Generate rule sets
        run: go run . -o output

      - name: Set release tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Publish to branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for format in srs mrs; do
            (
              cd "output/${format}"
              git init --quiet --initial-branch="${format}"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add --all
              git commit --quiet --message "${{ steps.tag.outputs.tag }}"
              git push --quiet --force "${remote}" "${format}"
            )
          done

      - name: Pack release assets
        run: |
          for format in srs mrs; do
            (cd "output/${format}" && zip --quiet --recurse-paths "../../${format}.zip" . --exclude ".git/*")
          done

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "${TAG}" srs.zip mrs.zip \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes ""
          gh release list --limit 1000 --json tagName --jq ".[${KEEP_RELEASES}:][].tagName" |
            while read -r tag; do
              gh release delete "${tag}" --cleanup-tag --yes
            done
